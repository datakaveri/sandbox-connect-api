apiVersion: v1
kind: Secret
metadata:
  name: elastic-apm-creds
  namespace: sandbox
stringData:
  # Shared across all services (api, worker, slot-lifecycle, profile-credit-sync).
  # Each service sets its own ELASTIC_APM_SERVICE_NAME directly in its manifest.
  ELASTIC_APM_SERVER_URL: "<your-apm-server-url>"
  ELASTIC_APM_SECRET_TOKEN: "<your-apm-secret-token>"
  ELASTIC_APM_ENVIRONMENT: "production"
  # If ELASTIC_APM_SERVER_URL uses HTTPS with a self-signed/internal cert (e.g.
  # ECK-managed apm-server-apm-http.elastic.svc), the Go agent rejects it by
  # default with "remote error: tls: bad certificate" and silently drops all
  # data. Set to "false" to unblock (as needed on dev-eks). Prefer pinning the
  # real CA via a mounted ELASTIC_APM_SERVER_CA_CERT_FILE instead for
  # staging/prod so TLS verification stays intact.
  ELASTIC_APM_VERIFY_SERVER_CERT: "false"
