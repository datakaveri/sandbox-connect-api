apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-refresher-sa
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-refresher-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "update", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-refresher-binding
subjects:
- kind: ServiceAccount
  name: secret-refresher-sa
  namespace: sandbox
roleRef:
  kind: ClusterRole
  name: secret-refresher-role
  apiGroup: rbac.authorization.k8s.io
