apiVersion: batch/v1
kind: CronJob
metadata:
  name: profile-credit-sync
  namespace: sandbox
spec:
  schedule: "*/15 * * * *"  
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3 
  failedJobsHistoryLimit: 3     
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: profile-credit-sync
            type: cron
        spec:
          serviceAccountName: notebook-manager-sa
          imagePullSecrets:
            - name: tgdex-registry-cred
          containers:
          - name: profile-credit-sync
            image: ghcr.io/datakaveri/tgdex-sandbox-credit-sync-cron:latest
            env:
            - name: PROFILE_CREDIT_SYNC_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: database-creds
                  key: POSTGRES_URL
            envFrom:
            - configMapRef:
                name: profile-credit-sync-config
            - secretRef:
                name: profile-credit-sync-keycloak-creds
            resources:
              limits:
                memory: "3Gi"
                cpu: "2"
              requests:
                memory: "1Gi"
                cpu: "500m"
          restartPolicy: OnFailure