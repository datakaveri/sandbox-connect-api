# Deployment example: replace environment-specific values before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: profile-credit-sync-config
  namespace: sandbox
data:
  PROFILE_CREDIT_SYNC_OPENCOST_URL: "http://opencost.opencost:9003"
  PROFILE_CREDIT_SYNC_AAA_URL: "https://credits.example.com"
  PROFILE_CREDIT_SYNC_KEYCLOAK_URL: "https://idp.example.com/auth"
  PROFILE_CREDIT_SYNC_KEYCLOAK_REALM: "<realm>"
  PROFILE_CREDIT_SYNC_KEYCLOAK_CLIENT_ID: "frontend-client"
  PROFILE_CREDIT_SYNC_K8S_CONFIG_MODE: "cluster"
  PROFILE_CREDIT_SYNC_GPU_RESOURCE_KEYS: "nvidia.com/gpu"
  PROFILE_CREDIT_SYNC_LOG_LEVEL: "debug"
---
