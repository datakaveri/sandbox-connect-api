apiVersion: v1
kind: ConfigMap
metadata:
  name: slot-lifecycle-config
  namespace: sandbox
data:
  SLOT_CONFIG_PROFILE: "production"
  SLOT_LIFECYCLE_LOG_LEVEL: "info"
  SLOT_LIFECYCLE_K8S_CONFIG_MODE: "cluster"
  SLOT_LIFECYCLE_K8S_CONFIG_PATH: ""
  SLOT_LIFECYCLE_TICK_INTERVAL_SECS: "5"
  SLOT_LIFECYCLE_RUN_TIMEOUT_SECS: "45"
  # Enable only after the evaluation migration. Keeps timed cleanup from
  # deleting a notebook PVC while its evaluation is active.
  SLOT_LIFECYCLE_EVALUATIONS_ENABLED: "false"

