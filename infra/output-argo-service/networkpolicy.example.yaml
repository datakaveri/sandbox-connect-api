# Template only: fill the exact DNS and service CIDRs before applying.
# Kubernetes NetworkPolicy does not support FQDN egress rules, so guessing
# values here could break workloads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: output-workloads-default-deny
  namespace: REPLACE_WITH_USER_NAMESPACE
spec:
  podSelector:
    matchLabels:
      workflows.argoproj.io/workflow: REPLACE_WITH_WORKFLOW_NAME
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
