# Examples only. Create these resources through the platform secret manager;
# never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: output-controller-creds
  namespace: sandbox
type: Opaque
stringData:
  POSTGRES_URL: "REPLACE_WITH_RESTRICTED_DATABASE_URL"
  FILES_CONNECT_SERVICE_TOKEN: "REPLACE_WITH_SERVICE_TOKEN"
---
# These resources are namespace-local inputs for the Argo workflow.
apiVersion: v1
kind: Secret
metadata:
  name: output-production-env
  namespace: REPLACE_WITH_USER_NAMESPACE
type: Opaque
stringData:
  REPLACE_WITH_PRODUCTION_ENV_NAME: "REPLACE_WITH_SECRET_VALUE"
---
apiVersion: v1
kind: Secret
metadata:
  name: output-file-service
  namespace: REPLACE_WITH_USER_NAMESPACE
type: Opaque
stringData:
  FILE_SERVICE_BASE_URL: "REPLACE_WITH_FILE_SERVICE_URL"
  # Production: run-scoped JWT. Demo fallback: Files Connect OUTPUT_SHARED_UPLOAD_TOKEN.
  FILE_SERVICE_TOKEN: "REPLACE_WITH_UPLOADER_TOKEN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: output-replacements-v1
  namespace: REPLACE_WITH_USER_NAMESPACE
data:
  replacements.json: |
    {"version":"v1","required":{},"optional":{}}
