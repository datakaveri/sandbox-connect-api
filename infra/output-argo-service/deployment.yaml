apiVersion: apps/v1
kind: Deployment
metadata:
  name: output-argo-service
  namespace: sandbox
  labels:
    app.kubernetes.io/name: output-argo-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: output-argo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: output-argo-service
    spec:
      serviceAccountName: output-argo-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "REPLACE_WITH_CONTROLLER_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
          imagePullPolicy: IfNotPresent
          env:
            - name: OUTPUT_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: output-controller-creds
                  key: POSTGRES_URL
            - name: OUTPUT_FILES_CONNECT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: output-controller-creds
                  key: FILES_CONNECT_SERVICE_TOKEN
          envFrom:
            - configMapRef:
                name: output-argo-service-config
          volumeMounts:
            # Source credentials copied into participant namespaces by the provisioner.
            - name: provision-registry
              mountPath: /var/run/output-provision/registry
              readOnly: true
            - name: provision-file-service
              mountPath: /var/run/output-provision/file-service
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: provision-registry
          secret:
            secretName: nha-registry-cred
        - name: provision-file-service
          secret:
            secretName: output-file-service
