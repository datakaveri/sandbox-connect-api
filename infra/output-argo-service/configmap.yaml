apiVersion: v1
kind: ConfigMap
metadata:
  name: output-argo-service-config
  namespace: sandbox
data:
  OUTPUT_KUBE_CONFIG_MODE: "cluster"
  OUTPUT_POLL_INTERVAL_SECONDS: "5"
  OUTPUT_PVC_WAIT_TIMEOUT_SECONDS: "300"
  OUTPUT_CLAIM_LEASE_SECONDS: "60"
  OUTPUT_MAX_MANIFEST_BYTES: "262144"
  OUTPUT_MAX_MANIFEST_FILES: "1000"
  OUTPUT_MAX_FILE_BYTES: "268435456"
  OUTPUT_MAX_BYTES: "1073741824"
  OUTPUT_RUNNER_IMAGE: "REPLACE_WITH_RUNNER_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
  OUTPUT_UPLOADER_IMAGE: "REPLACE_WITH_UPLOADER_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
  OUTPUT_WORKFLOW_SERVICE_ACCOUNT: "output-runner"
  OUTPUT_SCRATCH_STORAGE_CLASS: "REPLACE_WITH_RWO_STORAGE_CLASS"
  OUTPUT_SCRATCH_STORAGE_SIZE: "5Gi"
  OUTPUT_REPLACEMENT_CONFIG_MAP: "output-replacements-v1"
  OUTPUT_PRODUCTION_ENV_SECRET: "output-production-env"
  OUTPUT_FILE_SERVICE_SECRET: "output-file-service"
  OUTPUT_FILES_CONNECT_BASE_URL: "https://REPLACE_WITH_FILES_CONNECT_HOST/v1"
  OUTPUT_REVIEW_DATABANK_ID: "REPLACE_WITH_NHA_REVIEW_DATABANK_ID"
  OUTPUT_WORKSPACE_DATABANK_ID: "REPLACE_WITH_NHA_WORKSPACE_DATABANK_ID"
  OUTPUT_FILES_CONNECT_TIMEOUT_SECONDS: "30"
  OUTPUT_WORKFLOW_DEADLINE_SECONDS: "1800"
  OUTPUT_WORKFLOW_TTL_SECONDS: "3600"
  # Automatic participant-namespace provisioning: off | dry-run | apply.
  # Start with dry-run and review the logged drift before switching to apply.
  OUTPUT_PROVISION_MODE: "dry-run"
  OUTPUT_PROVISION_INTERVAL_SECONDS: "600"
  OUTPUT_PROVISION_PROFILE_LABEL: "app.kubernetes.io/part-of=kubeflow-profile"
  OUTPUT_PROVISION_ALLOWED_NAMESPACES: ""
  OUTPUT_PROVISION_RUNNER_CLUSTER_ROLE: "output-runner-executor"
  OUTPUT_PROVISION_REGISTRY_SECRET_NAME: "nha-registry-cred"
  OUTPUT_PROVISION_MTLS_SOURCE_NAMESPACE: "omop-auth"
  OUTPUT_PROVISION_MTLS_SOURCE_SECRET: "output-data-access-mtls-issued"
