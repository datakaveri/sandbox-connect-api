apiVersion: v1
kind: ServiceAccount
metadata:
  name: notebook-manager-sa
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: notebook-manager-role
rules:
- apiGroups: ["kubeflow.org"]
  resources: ["notebooks"]
  verbs: ["*"]
- apiGroups: ["kubeflow.org"]
  resources: ["profiles"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: notebook-manager-binding
subjects:
- kind: ServiceAccount
  name: notebook-manager-sa
  namespace: sandbox
roleRef:
  kind: ClusterRole
  name: notebook-manager-role
  apiGroup: rbac.authorization.k8s.io
