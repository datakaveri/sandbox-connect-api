apiVersion: v1
kind: Secret
metadata:
  name: api-creds
  namespace: sandbox
stringData:
  # AWS ECR credentials (required only if API_CREATE_ECR_SECRET is true)
  # API_AWS_ACCESS_KEY_ID: "<your-aws-access-key-id>"
  # API_AWS_SECRET_KEY: "<your-aws-secret-key>"
  # RabbitMQ credentials (required for audit publishing)
  RABBITMQ_USERNAME: "<your-rabbitmq-username>"
  RABBITMQ_PASSWORD: "<your-rabbitmq-password>"
  # CBR on-prem private registry credentials (required when API_REGISTRY_SECRET_ENABLED is true)
  API_REGISTRY_USERNAME: "cbr"
  API_REGISTRY_PASSWORD: "8vEiU6hf7s9q"
