apiVersion: v1
kind: Secret
metadata:
  name: api-creds
  namespace: sandbox
stringData:
  # RabbitMQ credentials (required for audit publishing)
  RABBITMQ_USERNAME: "<your-rabbitmq-username>"
  RABBITMQ_PASSWORD: "<your-rabbitmq-password>"
  # ECR credentials (required only when API_REGISTRY_SECRET_TYPE=ecr)
  API_REGISTRY_AWS_ACCESS_KEY_ID: "<your-aws-access-key-id>"
  API_REGISTRY_AWS_SECRET_KEY: "<your-aws-secret-key>"
  # Confidential Keycloak client used only by Sandbox Connect for token exchange.
  API_PLATFORM_TOKEN_EXCHANGE_CLIENT_SECRET: "<your-notebook-exchange-client-secret>"
  # Service credential used only for server-to-server Files Connect calls.
  API_FILES_CONNECT_SERVICE_TOKEN: "<your-files-connect-service-token>"
