apiVersion: v1
kind: Secret
metadata:
  name: api-creds
  namespace: sandbox
stringData:
  # API_AWS_ACCESS_KEY_ID: "<your-aws-access-key-id>"  # Required only if API_ECR_PULL_ENABLED is true
  # API_AWS_SECRET_KEY: "<your-aws-secret-key>"  # Required only if API_ECR_PULL_ENABLED is true
  # RabbitMQ credentials (required for audit publishing)
  RABBITMQ_USERNAME: "<your-rabbitmq-username>"
  RABBITMQ_PASSWORD: "<your-rabbitmq-password>"
