apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: sandbox
data:
  API_DEFAULT_STORAGE_SIZE: "10Gi"
  API_DEFAULT_CPU_REQUEST: "1"
  API_DEFAULT_CPU_LIMIT: "2"
  API_DEFAULT_MEMORY_REQUEST: "2Gi"
  API_DEFAULT_MEMORY_LIMIT: "4Gi"
  API_DEFAULT_GPU_TYPE: "nvidia"
  API_DEFAULT_GPU_LIMIT: "1"
  API_KUBEFLOW_URL: "https://sandbox.tgdex.telangana.gov.in"
  API_NOTEBOOK_LIST_LIMIT: "10"
  API_ADDRESS: "0.0.0.0:3000"
  API_KUBE_CONFIG_MODE: "cluster"
  API_CORS_ORIGINS: "*"
  API_RATE_LIMIT: "60"
  API_RATE_BURST: "10"
  API_KEYCLOAK_URL: "https://sandbox.tgdex.telangana.gov.in"
  API_KEYCLOAK_REALM: "tgdex"
  API_KEYCLOAK_CLIENT_ID: "angular-tgdex-client"
