apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: sandbox
data:
  API_DEFAULT_CPU_STORAGE_SIZE: "10Gi"
  API_DEFAULT_GPU_STORAGE_SIZE: "50Gi"
  API_DEFAULT_CPU_REQUEST: "3.5"
  API_DEFAULT_CPU_LIMIT: "4"
  API_DEFAULT_MEMORY_REQUEST: "7.5Gi"
  API_DEFAULT_MEMORY_LIMIT: "8Gi"
  API_DEFAULT_GPU_TYPE: "nvidia.com/gpu"
  API_DEFAULT_GPU_REQUEST: "1"
  API_DEFAULT_GPU_LIMIT: "1"
  API_KUBEFLOW_URL: "https://sandbox.tgdex.telangana.gov.in"
  API_JUPYTERLITE_BASE_URL: "/jupyterlite"
  API_JUPYTERLITE_STATIC_DIR: "/app/jupyterlite"
  API_NOTEBOOK_LIST_LIMIT: "10"
  API_STARTUP_NOTEBOOK_FILENAME: "demo.ipynb"
  API_ADDRESS: "0.0.0.0:3000"
  API_KUBE_CONFIG_MODE: "cluster"
  API_CORS_ORIGINS: "*"
  API_KYC_ENABLED: "true"
  API_RATE_LIMIT: "80"
  API_RATE_WINDOW_SECS: "30"
  API_KEYCLOAK_URL: "https://idp.tgdex.telangana.gov.in/auth"
  API_KEYCLOAK_REALM: "tgdex"
  API_KEYCLOAK_CLIENT_ID: "angular-tgdex-client"
  # Notebook delegation and sidecar refresh use the same confidential client.
  API_PLATFORM_TOKEN_EXCHANGE_CLIENT_ID: "sandbox-notebook"
  API_PLATFORM_TOKEN_NOTEBOOK_CLIENT_ID: "sandbox-notebook"
  API_PLATFORM_TOKEN_EXCHANGE_SCOPE: "openid profile email"
  API_PLATFORM_TOKEN_EXCHANGE_AUDIENCE: ""
  API_PLATFORM_TOKEN_READY_PORT: "8081"
  API_PLATFORM_TOKEN_READY_TIMEOUT_SECS: "40"
  API_TIMEOUT_SECS: "60"
  API_IDLE_TIMEOUT_SECS: "120"
  API_BOOKINGS_ENABLED: "true"
  WORKSPACE_ENABLED: "true"
  # Enable only after the output migration, controller, and Files Connect
  # contract are ready. Submission supports both direct and booking modes.
  API_OUTPUTS_ENABLED: "false"
  API_OUTPUT_NOTEBOOK_PATH: "nha_ps4_output_template.ipynb"
  API_OUTPUT_ADMIN_ROLES: "cos_admin"
  API_OUTPUT_MAX_MANIFEST_BYTES: "262144"
  API_OUTPUT_MAX_MANIFEST_FILES: "1000"
  API_OUTPUT_MAX_FILE_BYTES: "268435456"
  API_OUTPUT_MAX_BYTES: "1073741824"
  API_FILES_CONNECT_BASE_URL: "https://REPLACE_WITH_FILES_CONNECT_HOST/v1"
  API_FILES_CONNECT_REVIEW_DATABANK_ID: "REPLACE_WITH_NHA_REVIEW_DATABANK_ID"
  API_FILES_CONNECT_WORKSPACE_DATABANK_ID: "REPLACE_WITH_NHA_WORKSPACE_DATABANK_ID"
  API_FILES_CONNECT_TIMEOUT_SECONDS: "30"
  API_FILES_CONNECT_MAX_RESPONSE_BYTES: "4194304"
  API_MAX_BODY_SIZE_IN_MB: "5"
  API_WRITE_TIMEOUT_SECS: "60"
  API_READ_TIMEOUT_SECS: "30"
  API_KEYCLOAK_PUBLIC_KEY: ""
  API_VERSION: "v1"
  API_MAX_RUNNING_CPU: "2"
  API_MAX_RUNNING_GPU: "1"
  API_MAX_TOTAL_CPU: "6"
  API_MAX_TOTAL_GPU: "4"
  API_DEFAULT_GPU_CPU_REQUEST: "3"
  API_DEFAULT_GPU_CPU_LIMIT: "3.9"
  API_DEFAULT_GPU_MEMORY_REQUEST: "12Gi"
  API_DEFAULT_GPU_MEMORY_LIMIT: "14Gi"
  API_GPU_NODE_INSTANCE_TYPES: "g4dn.xlarge,p4d.24xlarge,p5.48xlarge"
  SLOT_CONFIG_PROFILE: "production"
  API_LOG_LEVEL: "debug"
  # Registry secret configuration
  # Set API_REGISTRY_SECRET_TYPE to one of: ecr | private-registry | none
  #
  # --- AWS ECR ---
  API_REGISTRY_SECRET_TYPE: "ecr"
  API_REGISTRY_URL: "108779579607.dkr.ecr.ap-south-1.amazonaws.com"
  API_REGISTRY_SECRET_NAME: "v2-registry-cred"
  API_REGISTRY_ECR_REGION: "ap-south-1"
  # RabbitMQ Configuration (Audit).
  # NOTE: a non-empty placeholder host ENABLES auditing and then fails DNS on
  # every publish. Set a real host or delete these five keys entirely.
  # Credentials belong in Secret api-creds, never here.
  RABBITMQ_HOST: "<your-rabbitmq-host>"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  RABBITMQ_EXCHANGE: "auditing"
  RABBITMQ_ROUTING_KEY: "<your-routing-key>"
