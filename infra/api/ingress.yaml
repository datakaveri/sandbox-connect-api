apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-api-ingress
  namespace: sandbox
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' unpkg.com cdn.redoc.ly blob:; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: cdn.redoc.ly;";
spec:
  tls:
  - hosts:
    - api.sandbox.tgdex.telangana.gov.in
    secretName: sandbox-api-tls
  rules:
  - host: api.sandbox.tgdex.telangana.gov.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sandbox-api
            port:
              number: 80
