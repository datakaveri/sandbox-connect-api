# Apply this namespace-scoped bundle through the profile/user namespace
# reconciler. Replace the namespace before applying; do not grant cluster-wide
# permissions to Workflow pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-runner
  namespace: REPLACE_WITH_USER_NAMESPACE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evaluation-runner
  namespace: REPLACE_WITH_USER_NAMESPACE
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evaluation-runner
  namespace: REPLACE_WITH_USER_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: evaluation-runner
    namespace: REPLACE_WITH_USER_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evaluation-runner
