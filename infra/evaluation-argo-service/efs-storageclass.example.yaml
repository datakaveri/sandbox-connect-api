# Review-only template. Do not apply until the EFS filesystem, regional mount
# targets, security groups, and aws-efs-csi-driver controller/node workloads
# have been created and validated.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: evaluation-efs-rwx
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: REPLACE_WITH_EFS_FILESYSTEM_ID
  directoryPerms: "0750"
  gidRangeStart: "50000"
  gidRangeEnd: "7000000"
  basePath: "/sandbox-evaluations"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
mountOptions:
  - tls
