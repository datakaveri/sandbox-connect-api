apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-argo-service-config
  namespace: sandbox
data:
  EVALUATION_KUBE_CONFIG_MODE: "cluster"
  EVALUATION_POLL_INTERVAL_SECONDS: "5"
  EVALUATION_PVC_WAIT_TIMEOUT_SECONDS: "300"
  EVALUATION_CLAIM_LEASE_SECONDS: "60"
  EVALUATION_MAX_MANIFEST_BYTES: "262144"
  EVALUATION_MAX_MANIFEST_FILES: "1000"
  EVALUATION_RUNNER_IMAGE: "REPLACE_WITH_RUNNER_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
  EVALUATION_UPLOADER_IMAGE: "REPLACE_WITH_UPLOADER_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
  EVALUATION_COPIER_IMAGE: "REPLACE_WITH_COPIER_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
  EVALUATION_WORKFLOW_SERVICE_ACCOUNT: "evaluation-runner"
  EVALUATION_COPY_SERVICE_ACCOUNT: "evaluation-runner"
  EVALUATION_SCRATCH_STORAGE_CLASS: "REPLACE_WITH_RWO_STORAGE_CLASS"
  EVALUATION_SCRATCH_STORAGE_SIZE: "5Gi"
  EVALUATION_REPLACEMENT_CONFIG_MAP: "evaluation-replacements-v1"
  EVALUATION_PRODUCTION_ENV_SECRET: "evaluation-production-env"
  EVALUATION_FILE_SERVICE_SECRET: "evaluation-file-service"
  EVALUATION_WORKSPACE_PVC: "evaluation-workspace"
  EVALUATION_USER_WORKSPACE_PATH: "/home/jovyan/evaluation-workspace"
  EVALUATION_WORKSPACE_MOUNT_PATH: "/workspace"
  EVALUATION_WORKFLOW_DEADLINE_SECONDS: "1800"
  EVALUATION_WORKFLOW_TTL_SECONDS: "3600"
  EVALUATION_COPY_DEADLINE_SECONDS: "900"
  EVALUATION_COPY_TTL_SECONDS: "3600"
