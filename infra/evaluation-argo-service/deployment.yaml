apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-argo-service
  namespace: sandbox
  labels:
    app.kubernetes.io/name: evaluation-argo-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-argo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-argo-service
    spec:
      serviceAccountName: evaluation-argo-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "REPLACE_WITH_CONTROLLER_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
          imagePullPolicy: IfNotPresent
          env:
            - name: EVALUATION_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: evaluation-database-creds
                  key: POSTGRES_URL
          envFrom:
            - configMapRef:
                name: evaluation-argo-service-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
