apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-worker-runtime-config
  namespace: sandbox
data:
  runtime-config.yaml: |
    apiVersion: sandbox-connect/v1alpha1
    defaults:
      externalPVCWaitTimeout: 120s
    workloads:
      cpu:
        scheduling:
          nodeSelector: {}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.kubernetes.io/instance-type
                        operator: In
                        values:
                          - cpu
          tolerations: []
          instanceTypeOverride:
            enabled: false
        securityContext:
          runAsUser: 1000
          runAsGroup: 100
          runAsNonRoot: true
          fsGroup: 100
          supplementalGroups:
            - 4001
        pvcMounts:
          - name: user-data
            mountPath: /home/jovyan
            workspace: true
            required: true
            readOnly: false
            source:
              type: managed
              claimNameTemplate: "{pvcName}"
              retentionPolicy: DeleteWithNotebook
              spec:
                storageClassName: ceph-block
                accessModes: [ReadWriteOnce]
                volumeMode: Filesystem
                resources:
                  requests:
                    storage: "{storageSize}"
          - name: cbr-nfs
            mountPath: /mnt/cbr
            required: true
            readOnly: true
            source:
              type: existing
              claimNameTemplate: cbr-nfs
              waitForBound: true
              expected:
                accessModes: [ReadWriteMany]
                volumeMode: Filesystem
      gpu:
        scheduling:
          nodeSelector: {}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.kubernetes.io/instance-type
                        operator: In
                        values:
                          - gpu
                          - aic
          tolerations: []
          instanceTypeOverride:
            enabled: true
            selectorKey: node.kubernetes.io/instance-type
            required: false
        securityContext:
          runAsUser: 1000
          runAsGroup: 100
          runAsNonRoot: true
          fsGroup: 100
          supplementalGroups:
            - 4001
        pvcMounts:
          - name: user-data
            mountPath: /home/jovyan
            workspace: true
            required: true
            readOnly: false
            source:
              type: managed
              claimNameTemplate: "{pvcName}"
              retentionPolicy: DeleteWithNotebook
              spec:
                storageClassName: ceph-block
                accessModes: [ReadWriteOnce]
                volumeMode: Filesystem
                resources:
                  requests:
                    storage: "{storageSize}"
          - name: cbr-nfs
            mountPath: /mnt/cbr
            required: true
            readOnly: true
            source:
              type: existing
              claimNameTemplate: cbr-nfs
              waitForBound: true
              expected:
                accessModes: [ReadWriteMany]
                volumeMode: Filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-worker-config
  namespace: sandbox
data:
  WORKER_CPU_NOTEBOOK_IMAGE: "registry.analytics.cbr-iisc.ac.in/cbr/data-access-sandbox-cpu-notebook:v3.7-fat"
  WORKER_GPU_NOTEBOOK_IMAGE: "registry.analytics.cbr-iisc.ac.in/cbr/data-access-sandbox-gpu-notebook:v3.7-fat"
  WORKER_INIT_CONTAINER_IMAGE: "registry.analytics.cbr-iisc.ac.in/cbr/test-notebook-file:v1.2-b42d188"
  WORKER_IMAGE_PULL_ENABLED: "true"
  WORKER_ECR_SECRET_NAME: "registry-cred"
  WORKER_GPU_NODE_INSTANCE_TYPE: "gpu"
  WORKER_GPU_NODE_INSTANCE_TYPES: "gpu,aic"
  WORKER_CPU_NODE_INSTANCE_TYPES: "cpu"
  WORKER_STORAGE_CLASS_NAME: "ceph-block"
  WORKER_DISABLE_INIT: "false"
  WORKER_PLATFORM_FILE_API_BASE_URL: "https://files.cbr-iisc.ac.in"
  WORKER_PLATFORM_KEYCLOAK_CLIENT_ID: "sandbox-notebook"
  WORKER_PLATFORM_KEYCLOAK_TOKEN_URL: "https://keycloak.cbr-iisc.ac.in/auth/realms/cbr/protocol/openid-connect/token"
  WORKER_PLATFORM_SANDBOX_CONNECT_API_BASE_URL: "https://api-sandbox.cbr-iisc.ac.in/api"
  WORKER_PLATFORM_TOKEN_SIDECAR_IMAGE: "ghcr.io/datakaveri/platform-token-sidecar:1.0.1-e07b220"
