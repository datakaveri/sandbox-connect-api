info:
  contact: {}
  description: |-
    API for sandbox notebooks (lifecycle via bookings) and profiles. Create CPU/GPU notebooks with POST /v1/bookings; the slot lifecycle service provisions and cleans up resources at the booked slot times.

    Booking lifecycle states:
    - `scheduled`: booking is accepted and counts against slot capacity, active-booking limits, and weekly quota. No notebook resource is linked yet. Users can cancel scheduled bookings, or reset them to cancelled if cleanup is needed before provisioning.
    - `ready`: slot start has arrived and a notebook metadata row is linked. The worker/lifecycle path is waiting for the Kubeflow Notebook resource to report ready replicas. Users can terminate ready bookings, or reset stuck ready bookings to expired.
    - `active`: the notebook is running and usable. `GET /v1/bookings` returns `notebookUrl` only for active bookings whose notebook resource has been applied. Active bookings can be extended to the next contiguous slot when capacity, category limits, and the one-extension rule allow.
    - `shutting_down`: the booking is inside the category pre-shutdown warning window before `slotEnd`. It remains an active-capacity state and may still be terminated; the lifecycle service will mark it completed at slot end.
    - `completed`: the session ended normally, either at `slotEnd` or through terminate. Completed bookings remain in history; automatic cleanup deletes notebook/PVC resources after the category shutdown grace period unless terminate already cleaned them.
    - `cancelled`: terminal state for scheduled bookings cancelled by the user, reset before resources were ready, or cancelled by lifecycle because the category configuration was invalid. Cancelled bookings do not consume active capacity.
    - `expired`: terminal state for ready bookings that never became active before the category no-show grace period, or ready bookings reset during cleanup. Scheduled bookings reset before resources are ready become cancelled, not expired.

    Active-capacity checks treat `scheduled`, `ready`, `active`, and `shutting_down` as active booking states. Weekly quota counts the same active booking states plus `completed`; `cancelled` and `expired` do not count toward active capacity, and `expired` is excluded from weekly quota.
  title: Sandbox Connect API
  version: "1.0"
paths:
  /v1/admin/outputs:
    get:
      parameters:
      - description: Maximum outputs (1-200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.PendingOutputsResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/cmd_api.Error403'
      security:
      - BearerAuth: []
      summary: List outputs pending NHA approval
      tags:
      - output-admin
  /v1/admin/outputs/{output_id}/approve:
    post:
      description: Queues idempotent Files Connect publication into the owner's object-backed
        workspace.
      parameters:
      - description: Output ID
        in: path
        name: output_id
        required: true
        type: string
      - description: Unique request key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/cmd_api.ApprovalResponse'
      security:
      - BearerAuth: []
      summary: Approve and publish output files
      tags:
      - output-admin
  /v1/admin/outputs/{output_id}/files:
    get:
      parameters:
      - description: Output ID
        in: path
        name: output_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.OutputFilesResponse'
      security:
      - BearerAuth: []
      summary: List CSV files for an output awaiting approval
      tags:
      - output-admin
  /v1/admin/outputs/{output_id}/files/{file_id}/preview:
    get:
      parameters:
      - description: Output ID
        in: path
        name: output_id
        required: true
        type: string
      - description: Stable file ID
        in: path
        name: file_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sandbox-backend-service_internal_filesconnect.Preview'
      security:
      - BearerAuth: []
      summary: Preview a pending CSV output file
      tags:
      - output-admin
  /v1/bookings:
    get:
      description: |-
        Lists CPU and GPU slot bookings for the current user with optional status filter and pagination.
        The `status` filter accepts comma-separated lifecycle states: `scheduled`, `ready`, `active`, `shutting_down`, `completed`, `cancelled`, `expired`, or `all` to disable filtering.
        `notebookUrl` is returned only when the booking is `active` and the linked notebook resource has been applied.
      parameters:
      - description: Comma-separated status filter, or 'all' to omit filtering
        in: query
        name: status
        type: string
      - description: Max rows (default 10, max 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.BookingsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.Error401'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/cmd_api.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.Error500'
      security:
      - BearerAuth: []
      summary: List user bookings
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: |-
        Creates a CPU or GPU booking from code-defined categories and slot templates selected by SLOT_CONFIG_PROFILE.

        New bookings are inserted as `scheduled`. Lifecycle automation moves `scheduled` bookings to `ready` at slot start, then to `active` once the Kubeflow Notebook reports ready replicas, then to `shutting_down` near slot end, and finally to `completed` at slot end.

        Booking limits are enforced as two separate rules.
        MaxActiveBookings counts scheduled, ready, active, and shutting_down bookings for the same user and category. When reached, the API returns 400 with "Active booking limit exceeded".
        MaxBookingsPerWeek counts scheduled, ready, active, shutting_down, and completed bookings for the same user, category, and selected week. When reached, the API returns 400 with "Weekly booking limit exceeded".
        Cancelled bookings do not count toward either limit. Expired bookings do not count toward weekly quota because expired can mean either no-show expiry after the booking became ready, or reset/cleanup of a stuck ready booking. Scheduled bookings reset before resources are ready become cancelled, not expired.
        The previous "You already have an upcoming booking" restriction has been removed. Users may create multiple future bookings within MaxActiveBookings, MaxBookingsPerWeek, slot availability, and duplicate booking rules.
      parameters:
      - description: Booking request
        in: body
        name: booking
        required: true
        schema:
          $ref: '#/definitions/cmd_api.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_api.CreateBookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.Error400'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/cmd_api.Error403'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cmd_api.Error404'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/cmd_api.Error409'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/cmd_api.Error422'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/cmd_api.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.Error500'
      security:
      - BearerAuth: []
      summary: Create slot booking
      tags:
      - bookings
  /v1/bookings/{id}/cancel:
    patch:
      description: |-
        Cancels a `scheduled` booking for the current user before resources are ready.
        Cancel changes `scheduled` to `cancelled`. It does not operate on `ready`, `active`, or `shutting_down`; use terminate for those states.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.SwaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.Error400'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.Error401'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cmd_api.Error404'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/cmd_api.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.Error500'
      security:
      - BearerAuth: []
      summary: Cancel scheduled booking
      tags:
      - bookings
  /v1/bookings/{id}/extend:
    patch:
      description: |-
        Extends an `active` booking to the next contiguous slot if that slot has capacity, the category has not reached its contiguous-slot limit, and the booking has not already been extended.
        The booking remains `active`; `slot_keys`, `slot_end`, `shutdown_warning_sent_at`, and `extension_used` are updated so lifecycle timing follows the new end time.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.ExtendBookingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.Error400'
        "401":
