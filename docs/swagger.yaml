basePath: /
definitions:
  constants.Events:
    enum:
    - picked
    - pvc-applied
    - pvc-apply-failed
    - pvc-created
    - pvc-creation-failed
    - pvc-upload-successful
    - pvc-upload-applied
    - pvc-upload-apply-failed
    - pvc-upload-failed
    - notebook-applied
    - notebook-apply-failed
    type: string
    x-enum-varnames:
    - StatusPicked
    - StatusPVCApplied
    - StatusPVCApplyFailed
    - StatusPVCCreated
    - StatusPVCCreationFailed
    - StatusPVCUploadSuccessful
    - StatusPVCUploadApplied
    - StatusPVCUploadApplyFailed
    - StatusPVCUploadFailed
    - StatusNotebookApplied
    - StatusNotebookApplyFailed
  main.DeleteNotebookRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  main.GPUInstanceType:
    description: A single GPU instance type option with display metadata
    properties:
      instanceType:
        description: AWS instance type identifier
        example: g4dn.xlarge
        type: string
      displayName:
        description: Display name for the card UI
        example: Basic
        type: string
      gpuMemory:
        description: GPU memory available
        example: 16 GB
        type: string
      description:
        description: Human-readable description of the GPU
        example: 16 GB NVIDIA T4 GPU
        type: string
      sessionDuration:
        description: Maximum session duration
        example: 4h Session
        type: string
    type: object
  main.GPUInstanceTypesResponse:
    description: List of available GPU instance types with metadata
    properties:
      instanceTypes:
        items:
          $ref: '#/definitions/main.GPUInstanceType'
        type: array
    type: object
  main.Error400:
    description: Response for bad request errors
    properties:
      detail:
        description: Error message
        example: string
        type: string
      type:
        example: error
        type: string
    type: object
  main.Error401:
    description: Response for authentication errors
    properties:
      detail:
        description: Error message
        example: string
        type: string
      type:
        example: error
        type: string
    type: object
  main.Error403:
    description: Response for permission errors
    properties:
      detail:
        description: Error message
        example: string
        type: string
      type:
        example: error
        type: string
    type: object
  main.Error404:
    description: Response for resource not found errors
    properties:
      detail:
        description: Error message
        example: string
        type: string
      type:
        example: error
        type: string
    type: object
  main.Error409:
    description: Response for resource conflict errors
    properties:
      detail:
        description: Error message
        example: string
        type: string
      type:
        example: error
        type: string
    type: object
  main.Error422:
    description: Response for invalid request body errors
    properties:
      detail:
        description: Error message
        example: string
        type: string
      type:
        example: error
        type: string
    type: object
  main.Error429:
    description: Response for rate limiting errors
    properties:
      detail:
        description: Error message
        example: string
        type: string
      type:
        example: error
        type: string
    type: object
  main.Error500:
    description: Response for internal server errors
    properties:
      detail:
        description: Error message
        example: string
        type: string
      type:
        example: error
        type: string
    type: object
  main.NotebookListResponse:
    properties:
      next_offset:
        type: integer
      notebooks:
        items:
          $ref: '#/definitions/main.NotebookStatus'
        type: array
    type: object
  main.NotebookRequest:
    properties:
      name:
        maxLength: 50
        minLength: 4
        type: string
      type:
        description: Notebook type (cpu or gpu)
        type: string
      instanceType:
        description: GPU instance type (required when type=gpu). Must match one of the types from GET /v1/notebook/gpu-instance-types
        type: string
    required:
    - name
    - type
    type: object
  main.NotebookState:
    enum:
    - opening
    - running
    - stopped
    - failed
    - orphaned
    type: string
    x-enum-varnames:
    - NotebookStateOpening
    - NotebookStateRunning
    - NotebookStateStopped
    - NotebookStateFailed
    - NotebookStateOrphaned
  main.NotebookStatus:
    properties:
      cpuLimit:
        type: number
      cpuRequest:
        type: number
      createdAt:
        type: string
      events:
        items:
          $ref: '#/definitions/constants.Events'
        type: array
      gpuLimit:
        type: integer
      gpuRequest:
        type: integer
      gpuType:
        type: string
      id:
        type: integer
      instanceType:
        description: GPU instance type selected for the notebook (null for CPU notebooks)
        type: string
      memoryLimit:
        type: string
      memoryRequest:
        type: string
      name:
        type: string
      namespace:
        type: string
      notebookUrl:
        type: string
      pvcName:
        type: string
      status:
        $ref: '#/definitions/main.NotebookState'
      storageSize:
        type: string
      templateName:
        type: string
    type: object
  main.StartNotebookRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  main.StopNotebookRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  main.SwaggerExistsResponse:
    description: Response structure for check-exists endpoint
    properties:
      exists:
        description: Whether the resource exists
        example: true
        type: boolean
    type: object
  main.SwaggerMessageResponse:
    description: Standard success response structure with a message
    properties:
      message:
        description: Success message
        example: string
        type: string
    type: object
info:
  contact: {}
  description: API for managing notebooks and profiles
  title: Sandbox Connect API
  version: "1.0"
paths:
  /v1/notebook/check-exists/{notebook_name}:
    get:
      description: Checks if a notebook with the given name exists
      parameters:
      - description: Notebook Name
        in: path
        name: notebook_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerExistsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.Error400'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: Check if notebook exists
      tags:
      - notebook
  /v1/notebook/gpu-instance-types:
    get:
      description: Returns the list of available GPU node instance types with display metadata for notebook creation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.GPUInstanceTypesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: List available GPU instance types
      tags:
      - notebook
  /v1/notebook/create:
    post:
      consumes:
      - application/json
      description: Creates a new notebook for the user
      parameters:
      - description: Notebook Create Request
        in: body
        name: notebook
        required: true
        schema:
          $ref: '#/definitions/main.NotebookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.SwaggerMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.Error403'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.Error409'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/main.Error422'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: Create notebook
      tags:
      - notebook
  /v1/notebook/delete:
    delete:
      consumes:
      - application/json
      description: Deletes a notebook by name
      parameters:
      - description: Notebook Delete Request
        in: body
        name: notebook_name
        required: true
        schema:
          $ref: '#/definitions/main.DeleteNotebookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Error404'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/main.Error422'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: Delete notebook
      tags:
      - notebook
  /v1/notebook/list:
    get:
      description: Lists all notebooks for the user
      parameters:
      - description: Maximum number of notebooks to return (max 50)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Sort order (asc or desc)
        in: query
        name: order
        type: string
      - description: Date filter as JSON array of two date strings [start, end]
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.NotebookListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.Error400'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: List notebooks
      tags:
      - notebook
  /v1/notebook/start:
    patch:
      consumes:
      - application/json
      description: Starts an existing notebook
      parameters:
      - description: Notebook Start Request
        in: body
        name: notebook_name
        required: true
        schema:
          $ref: '#/definitions/main.StartNotebookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Error404'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/main.Error422'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: Start notebook
      tags:
      - notebook
  /v1/notebook/status/{notebook_name}:
    get:
      description: Gets the status of a notebook
      parameters:
      - description: Notebook Name
        in: path
        name: notebook_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.NotebookStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Error404'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: Get notebook status
      tags:
      - notebook
  /v1/notebook/stop:
    patch:
      consumes:
      - application/json
      description: Stops a running notebook
      parameters:
      - description: Notebook Stop Request
        in: body
        name: notebook_name
        required: true
        schema:
          $ref: '#/definitions/main.StopNotebookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.SwaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.Error400'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.Error404'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/main.Error422'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: Stop notebook
      tags:
      - notebook
  /v1/profile/create:
    post:
      consumes:
      - application/json
      description: Creates a Kubeflow Profile CRD for the user
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.SwaggerMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/main.Error401'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/main.Error422'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/main.Error429'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.Error500'
      security:
      - BearerAuth: []
      summary: Create Kubeflow profile
      tags:
      - profile
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Bearer token authentication. Example: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
x-extension-info-cors: Configurable CORS origins
x-extension-info-ratelimit: 100 requests per minute
