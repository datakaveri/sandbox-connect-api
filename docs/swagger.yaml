  /v1/bookings/{id}/reset:
    patch:
      description: |-
        Resets only `scheduled` or `ready` bookings that are stuck or need cleanup.
        `scheduled` resets become `cancelled` and unlink any notebook id. `ready` resets become `expired`, set session and cleanup timestamps, unlink the notebook, and best-effort delete the linked Notebook/PVC.
        Reset does not apply to `active`, `shutting_down`, `completed`, `cancelled`, or already `expired` bookings.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.SwaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.Error400'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.Error401'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cmd_api.Error404'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.Error500'
      security:
      - BearerAuth: []
      summary: Reset stuck booking
      tags:
      - bookings
  /v1/bookings/{id}/terminate:
    patch:
      description: |-
        Ends a `ready`, `active`, or `shutting_down` booking early and marks it `completed`.
        Terminate sets session and cleanup timestamps, unlinks the notebook, and best-effort deletes the linked Notebook/PVC. If the booking is already `completed`, the endpoint returns success without changing it.
        Use cancel or reset for `scheduled` bookings; terminate does not apply to `cancelled` or `expired` bookings.
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.SwaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.Error400'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.Error401'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cmd_api.Error404'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.Error500'
      security:
      - BearerAuth: []
      summary: End booking session early
      tags:
      - bookings
