          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.Error401'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.Error404'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.Error500'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: End booking session early
      tags:
      - bookings
      x-dx-authz:
        authentication: required
        authorization: identity
